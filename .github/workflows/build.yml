name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep the same debug signing key between builds so updates install over the old app
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/signing.keystore; fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk maamal-elkhobaraa.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maamal-elkhobaraa-apk
          path: maamal-elkhobaraa.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سيستم معمل الخبراء 1.0.${{ github.run_number }}
          body: |
            نسخة APK رقم 1.0.${{ github.run_number }} — نزّل الملف maamal-elkhobaraa.apk وثبّته على الموبايل.
          files: maamal-elkhobaraa.apk
          make_latest: true

      - name: Publish build log to build-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          echo "status=${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/logs/status.txt
          [ -f build.log ] && grep -nE "^e: |error:|FAILED|What went wrong" -A3 build.log | head -300 > /tmp/logs/errors.txt || true
          [ -f build.log ] && tail -400 build.log > /tmp/logs/build-tail.log || true
          cd /tmp/logs
          git init -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
